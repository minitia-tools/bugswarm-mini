[package]
name = "bugswarm-sandbox"
version = "0.1.0"
edition = "2021"
description = "Bug Swarm CLI — Execution Sandbox Daemon. Isolated PoC execution with cryptographic receipts."

[dependencies]
bugswarm-evidence = { path = "../bugswarm-evidence" }
bugswarm-symbolic = { path = "../bugswarm-symbolic" }
tokio = { version = "1.41", features = ["full"] }
bollard = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
nix = { version = "0.29", features = ["signal", "process", "time"] }
libc = "0.2"
bytes = "1.8"
regex = "1.11"
regex-lite = "0.1"
futures-util = "0.3"
log = "0.4"
serde_yaml = "0.9"
num_cpus = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
strsim = "0.11"

[dev-dependencies]
tempfile = "3.14"
tokio-test = "0.4"
rstest = "0.23"
