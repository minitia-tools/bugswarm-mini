[package]
name = "bugswarm-sandbox"
version = "1.0.0"
edition = "2021"
description = "Bug Swarm CLI — Execution Sandbox Daemon. Isolated PoC execution with cryptographic receipts."

[features]
default = []
symbolic = ["bugswarm-symbolic"]
telemetry = ["opentelemetry", "tracing-opentelemetry", "opentelemetry-otlp"]

[dependencies]
bugswarm-evidence = { path = "../bugswarm-evidence" }
bugswarm-symbolic = { path = "../bugswarm-symbolic", optional = true }
tokio = { version = "1.41", features = ["full"] }
axum = "0.7"
hyper = { version = "1", features = ["server"] }
# bollard 0.18+ may require Docker API version bump
bollard = ">=0.17, <0.18"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
blake3 = "1.5"
hex = "0.4"
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = "1.0"
thiserror = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# nix: Linux-specific syscall wrapper. Sandbox requires Linux for Docker/seccomp/namespaces.
nix = { version = "0.29", features = ["signal", "process", "time"] }
libc = "0.2"
bytes = "1.8"
regex = { workspace = true }
regex-lite = "0.1"
walkdir = "2"
futures-util = "0.3"
log = { workspace = true }
serde_yaml = "0.9"
num_cpus = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
strsim = "0.11"
once_cell = "1"
opentelemetry = { version = "0.23", optional = true }
tracing-opentelemetry = { version = "0.24", optional = true }
opentelemetry-otlp = { version = "0.16", optional = true, features = ["tonic"] }

[dev-dependencies]
tempfile = "3.14"
tokio-test = "0.4"
rstest = "0.23"
