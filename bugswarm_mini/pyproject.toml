[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bugswarm-mini"
version = "0.1.0"
description = "BugSwarm — autonomous bug hunting with AI agents"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.27",
    "structlog>=24.0",
]
