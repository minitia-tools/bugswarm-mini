[project]
name = "bugswarm-agent"
version = "0.1.0"
description = "Bug Swarm Agent — Single-agent IEP loop for bug detection"
requires-python = ">=3.11"
dependencies = [
    "bugswarm-gateway",
    "pydantic>=2.10.0,<3.0",
    "tiktoken>=0.8.0,<1.0",
]

[project.scripts]
bugswarm-agent = "agent.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
