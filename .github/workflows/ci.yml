name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo check --workspace --all-features
      - run: cargo clippy --all -- -D warnings
      - run: cargo test --workspace
      - run: cargo fmt --check
      - run: cargo audit
      - name: SAFETY comments check
        run: bash bugswarm-sandbox/ci/check_safety_comments.sh

  python:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ruff mypy pre-commit
      - run: pip install -e bugswarm-gateway/ bugswarm-agent/ . 2>/dev/null || true
      - name: ruff check
        run: ruff check --output-format=concise .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy --strict --ignore-missing-imports bugswarm_mini/ bugswarm-gateway/src/gateway/ bugswarm-agent/src/agent/ bugswarm-swarm/src/swarm/ || true
      - name: pytest (secrets)
        run: python3 -m pytest tests/unit/test_secrets.py -q --tb=short
