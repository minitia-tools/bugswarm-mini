[workspace]
members = [
    "bugswarm-sandbox",
    "bugswarm-cpg",
    "bugswarm-evidence", "bugswarm-symbolic",
]
resolver = "2"

[workspace.metadata]
telemetry = ["dep:opentelemetry", "dep:tracing-opentelemetry", "dep:opentelemetry-otlp"]

[workspace.dependencies]
serde = { version = ">=1.0, <2.0", features = ["derive"] }
serde_json = ">=1.0, <2.0"
chrono = { version = ">=0.4, <0.5", features = ["serde"] }
uuid = { version = ">=1, <2", features = ["v4", "serde"] }
sha2 = ">=0.10, <0.11"
thiserror = ">=2.0, <3.0"
tracing = ">=0.1, <0.2"
tracing-subscriber = { version = ">=0.3, <0.4", features = ["json", "env-filter"] }
regex = ">=1, <2"
log = ">=0.4, <0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = 'abort'
