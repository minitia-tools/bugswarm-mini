[package]
name = "bugswarm-evidence"
version = "1.0.0"
edition = "2021"
description = "Bug Swarm CLI — Evidence Graph. Immutable hypergraph for agent evidence, replacing debate with structured discovery."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = { workspace = true }
strsim = "0.11"
hex = "0.4"
uuid = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "signal"] }
parking_lot = "0.12"
fxhash = "0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rstest = "0.23"
