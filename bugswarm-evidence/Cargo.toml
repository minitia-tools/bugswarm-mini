[package]
name = "bugswarm-evidence"
version = "0.1.0"
edition = "2021"
description = "Bug Swarm CLI — Evidence Graph. Immutable hypergraph for agent evidence, replacing debate with structured discovery."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
strsim = "0.11"
hex = "0.4"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "signal"] }
parking_lot = "0.12"
fxhash = "0.2"
tracing = "0.1"

[dev-dependencies]
rstest = "0.23"
