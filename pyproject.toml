[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bugswarm-mini"
version = "0.1.0"
description = "BugSwarm — autonomous bug hunting with AI agents"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.scripts]
bugswarm = "bugswarm_mini.__main__:main"

[tool.setuptools.packages.find]
include = ["bugswarm_mini*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "F",    # pyflakes — unused imports, undefined names
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern syntax)
    "S",    # security (hardcoded passwords, tmpfile)
    "B",    # bugbear (logic errors, except handling)
    "RUF",  # ruff-specific (useless expressions)
]
ignore = [
    "E501",   # Line too long (enforced by ruff format instead)
    "E402",   # Module-level import not at top (needed for sys.path hacks)
]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["ALL"]
"bugswarm_mini/tests/**" = ["ALL"]
"bugswarm-gateway/src/gateway/tests/**" = ["ALL"]
"bugswarm-agent/src/agent/tests/**" = ["ALL"]
"*.pyc" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
exclude = [
    '.venv/',
    'build/',
    'dist/',
    'bugswarm_mini/tests/',
    'tests/',
]

[[tool.mypy.overrides]]
module = ['bugswarm_mini.tests.*', 'tests.*']
ignore_errors = true
