[package]
name = "bugswarm-symbolic"
version = "0.1.0"
edition = "2021"
description = "BugSwarm Symbolic Execution Engine — Z3 SMT Solver Integration for Precise Triggering Inputs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
z3 = "0.14"
log = "0.4"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
strsim = "0.11"
