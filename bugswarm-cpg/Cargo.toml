[package]
name = "bugswarm-cpg"
version = "0.1.0"
edition = "2021"
description = "Bug Swarm CLI — Code Property Graph Builder. Static analysis graph for multi-language codebases."

[dependencies]
tree-sitter = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
petgraph = "0.7"
regex = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
walkdir = "2.5"
log = { workspace = true }
tokio = { version = "1.41", features = ["full"] }
parking_lot = "0.12"
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
rstest = "0.23"
